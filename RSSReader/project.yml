name: RSSReader
options:
  bundleIdPrefix: com.rssreader
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

packages:
  FeedKit:
    url: https://github.com/nmdias/FeedKit.git
    from: 9.1.2

targets:
  RSSReader:
    type: application
    platform: macOS
    sources:
      - path: RSSReader
      - path: Shared
    dependencies:
      - package: FeedKit
      - target: RSSReaderWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rssreader.app
        PRODUCT_NAME: RSSReader
        SWIFT_VERSION: 5.10
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGNING_REQUIRED: YES
        DEVELOPMENT_TEAM: DCF47747Q6
        INFOPLIST_FILE: RSSReader/Info.plist
        CODE_SIGN_ENTITLEMENTS: RSSReader/RSSReader.entitlements
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: ""

  RSSReaderWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: RSSReaderWidget
      - path: Shared/AppGroup.swift
      - path: Shared/WidgetDataBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rssreader.app.widget
        PRODUCT_NAME: RSSReaderWidget
        SWIFT_VERSION: 5.10
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGNING_REQUIRED: YES
        DEVELOPMENT_TEAM: DCF47747Q6
        INFOPLIST_FILE: RSSReaderWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: RSSReaderWidget/RSSReaderWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../../../../Frameworks @executable_path/../Frameworks
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  RSSReader:
    build:
      targets:
        RSSReader: all
        RSSReaderWidget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
